<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Bounty Board</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #2b1d0e;
      background-image: 
        linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)),
        url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='40' height='40' fill='%233d2b1a'/%3E%3Crect x='0' y='0' width='20' height='20' fill='%234a3520'/%3E%3Crect x='20' y='20' width='20' height='20' fill='%234a3520'/%3E%3C/svg%3E");
      font-family: 'Press Start 2P', cursive;
      color: #f5e6c8;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-size: 1.8rem;
      text-align: center;
      margin: 20px 0 10px;
      color: #ffd700;
      text-shadow: 4px 4px 0 #000;
      letter-spacing: 2px;
    }

    .subtitle {
      font-size: 0.7rem;
      color: #c9a86c;
      margin-bottom: 30px;
      text-align: center;
    }

    .board {
      background: #5c3a21;
      border: 8px solid #3e2514;
      border-radius: 4px;
      box-shadow: 
        inset 0 0 30px rgba(0,0,0,0.5),
        0 10px 0 #2a180c,
        0 15px 25px rgba(0,0,0,0.6);
      width: 100%;
      max-width: 800px;
      padding: 25px;
      position: relative;
    }

    /* Wood grain effect */
    .board::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        90deg,
        transparent,
        transparent 8px,
        rgba(0,0,0,0.08) 8px,
        rgba(0,0,0,0.08) 10px
      );
      pointer-events: none;
    }

    .form-section {
      background: #f5e6c8;
      color: #3e2514;
      border: 4px solid #8b5a2b;
      padding: 20px;
      margin-bottom: 30px;
      box-shadow: 4px 4px 0 #2a180c;
      position: relative;
    }

    .form-section::after {
      content: '📌';
      position: absolute;
      top: -12px;
      left: 20px;
      font-size: 1.5rem;
    }

    .form-row {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 15px;
    }

    label {
      font-size: 0.65rem;
      display: block;
      margin-bottom: 6px;
      color: #5c3a21;
    }

    input {
      font-family: 'Press Start 2P', cursive;
      font-size: 0.7rem;
      padding: 10px 12px;
      border: 3px solid #8b5a2b;
      background: #fff8e7;
      color: #3e2514;
      width: 100%;
      max-width: 280px;
    }

    input:focus {
      outline: none;
      border-color: #c9a86c;
      background: #fff;
    }

    button {
      font-family: 'Press Start 2P', cursive;
      font-size: 0.7rem;
      background: #4a7c23;
      color: #e8f5c8;
      border: 4px solid #2d4a15;
      padding: 12px 20px;
      cursor: pointer;
      box-shadow: 0 4px 0 #1e3310;
      transition: all 0.1s;
      margin-top: 10px;
    }

    button:hover {
      background: #5a9c2d;
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #1e3310;
    }

    button:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #1e3310;
    }

    .bounties {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .bounty-card {
      background: #f8f0d8;
      color: #3e2514;
      border: 3px solid #8b5a2b;
      padding: 18px 15px 15px;
      position: relative;
      box-shadow: 3px 3px 0 #2a180c;
      transform: rotate(-1deg);
      transition: transform 0.15s;
    }

    .bounty-card:nth-child(even) {
      transform: rotate(1.5deg);
    }

    .bounty-card:hover {
      transform: rotate(0deg) scale(1.03);
      z-index: 5;
    }

    .bounty-card .pin {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.3rem;
    }

    .bounty-card h3 {
      font-size: 0.75rem;
      margin-bottom: 12px;
      text-align: center;
      word-break: break-word;
      color: #8b0000;
      text-shadow: 1px 1px 0 #fff;
    }

    .reward {
      font-size: 0.65rem;
      text-align: center;
      background: #3e2514;
      color: #ffd700;
      padding: 8px;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .diamond {
      display: inline-block;
      width: 16px;
      height: 16px;
      background: #4ae2e8;
      clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
      box-shadow: inset 2px 2px 0 #a0ffff, inset -2px -2px 0 #1a8a8f;
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px 20px;
      color: #c9a86c;
      font-size: 0.7rem;
      line-height: 1.8;
    }

    .footer {
      margin-top: 30px;
      font-size: 0.55rem;
      color: #8b7355;
      text-align: center;
    }

    /* Delete button */
    .delete-btn {
      position: absolute;
      top: 6px;
      right: 8px;
      background: transparent;
      border: none;
      color: #8b0000;
      font-size: 0.9rem;
      cursor: pointer;
      padding: 0;
      box-shadow: none;
      line-height: 1;
    }

    .delete-btn:hover {
      color: #ff0000;
      transform: none;
      box-shadow: none;
      background: transparent;
    }
  </style>
</head>
<body>
  <h1>⚔ BOUNTY BOARD ⚔</h1>
  <p class="subtitle">WANTED — DEAD OR ALIVE (preferably with diamonds)</p>

  <div class="board">
    <div class="form-section">
      <div class="form-row">
        <div>
          <label for="name">Target Name</label>
          <input type="text" id="name" placeholder="Steve" maxlength="20">
        </div>
        <div>
          <label for="amount">Bounty (♦ Diamonds)</label>
          <input type="number" id="amount" placeholder="64" min="1" max="99999">
        </div>
      </div>
      <button onclick="addBounty()">POST BOUNTY</button>
    </div>

    <div class="bounties" id="bountyList">
      <div class="empty">No bounties posted yet...<br>Be the first to put a price on someone's head!</div>
    </div>
  </div>

  <p class="footer">All bounties paid in Minecraft diamonds • Not affiliated with Mojang</p>

  <script>
    let bounties = JSON.parse(localStorage.getItem('mcBounties') || '[]');

    function render() {
      const list = document.getElementById('bountyList');
      
      if (bounties.length === 0) {
        list.innerHTML = `<div class="empty">No bounties posted yet...<br>Be the first to put a price on someone's head!</div>`;
        return;
      }

      list.innerHTML = bounties.map((b, i) => `
        <div class="bounty-card">
          <div class="pin">📌</div>
          <button class="delete-btn" onclick="removeBounty(${i})" title="Remove">×</button>
          <h3>${escapeHtml(b.name)}</h3>
          <div class="reward">
            <span class="diamond"></span>
            ${b.amount.toLocaleString()} Diamonds
          </div>
        </div>
      `).join('');
    }

    function addBounty() {
      const nameInput = document.getElementById('name');
      const amountInput = document.getElementById('amount');
      
      const name = nameInput.value.trim();
      const amount = parseInt(amountInput.value);

      if (!name) {
        alert('Enter a name, adventurer!');
        return;
      }
      if (!amount || amount < 1) {
        alert('Bounty must be at least 1 diamond!');
        return;
      }

      bounties.unshift({ name, amount });
      localStorage.setItem('mcBounties', JSON.stringify(bounties));
      
      nameInput.value = '';
      amountInput.value = '';
      render();
    }

    function removeBounty(index) {
      if (confirm('Remove this bounty?')) {
        bounties.splice(index, 1);
        localStorage.setItem('mcBounties', JSON.stringify(bounties));
        render();
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Allow Enter key to submit
    document.getElementById('name').addEventListener('keydown', e => {
      if (e.key === 'Enter') addBounty();
    });
    document.getElementById('amount').addEventListener('keydown', e => {
      if (e.key === 'Enter') addBounty();
    });

    render();
  </script>
</body>
</html>
